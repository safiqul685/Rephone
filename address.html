<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delivery Address</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
}

.container{
    max-width:450px;
    margin:20px auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input,
textarea{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
    box-sizing:border-box;
}

textarea{
    height:100px;
    resize:none;
}

button{
    width:100%;
    padding:15px;
    background:#16a34a;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#15803d;
}

</style>

</head>


<body>


<div class="container">

<h2>
    Delivery Address
</h2>


<form onsubmit="confirmOrder(); return false;">


<input
    type="text"
    id="fullName"
    placeholder="Full Name"
    required
>


<input
    type="tel"
    id="mobile"
    maxlength="10"
    inputmode="numeric"
    placeholder="Mobile Number"
    required
>


<textarea
    id="address"
    placeholder="House No / Village / Road"
    required
></textarea>


<input
    type="text"
    id="city"
    placeholder="City / Town"
    required
>


<input
    type="text"
    id="district"
    placeholder="District"
    required
>


<input
    type="text"
    id="state"
    placeholder="State"
    required
>


<input
    type="text"
    id="pin"
    maxlength="6"
    inputmode="numeric"
    placeholder="PIN Code"
    required
>


<button type="submit">
    Continue to Payment
</button>


</form>

</div>


<script>

function confirmOrder(){

    // ==============================
    // GET PRODUCT ID
    // ==============================

    const params =
        new URLSearchParams(window.location.search);

    const productId =
        params.get("id");


    if(!productId){

        alert("Product ID nahi mila!");
        return;

    }


    // ==============================
    // CREATE ORDER ID
    // ==============================

    const orderId =
        "RP" + Date.now();


    // ==============================
    // GET SAVED PRODUCT DATA
    // ==============================

    const productName =
        localStorage.getItem("currentProductName") || "Product";


    const price =
        localStorage.getItem("currentProductPrice") || "";


    const razorpayLink =
        localStorage.getItem("currentCodRazorpayLink");


    if(!razorpayLink){

        alert("COD Razorpay payment link nahi mila!");
        return;

    }


    // ==============================
    // DELIVERY ADDRESS
    // ==============================

    const order = {

        orderId: orderId,

        productId: productId,

        productName: productName,

        price: price,

        fullName:
            document.getElementById("fullName")
            .value.trim(),

        mobile:
            document.getElementById("mobile")
            .value.trim(),

        address:
            document.getElementById("address")
            .value.trim(),

        city:
            document.getElementById("city")
            .value.trim(),

        district:
            document.getElementById("district")
            .value.trim(),

        state:
            document.getElementById("state")
            .value.trim(),

        pin:
            document.getElementById("pin")
            .value.trim(),

        paymentMethod:
            "Cash on Delivery",

        paymentStatus:
            "Pending",

        orderStatus:
            "Order Placed",

        orderDate:
            new Date().toLocaleString()

    };


    // ==============================
    // SAVE CURRENT ORDER
    // ==============================

    localStorage.setItem(
        "currentOrder",
        JSON.stringify(order)
    );


    // ==============================
    // SAVE ORDER ID
    // ==============================

    localStorage.setItem(
        "currentOrderId",
        orderId
    );


    // ==============================
    // OPEN COD RAZORPAY
    // ==============================

    window.location.href =
        razorpayLink;

}

</script>


</body>

</html>
