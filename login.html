<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Rephone</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      width: 92%;
      max-width: 400px;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #111;
    }

    .title {
      text-align: center;
      font-size: 22px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #ff9900;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #ff9900;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #otpSection {
      display: none;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .terms {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 20px;
      line-height: 1.5;
    }

    #recaptcha-container {
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">Rephone</div>

    <div class="title">Login</div>

    <div class="subtitle">
      Login with your mobile number
    </div>


    <!-- Mobile Number -->
    <div id="phoneSection">

      <label for="phoneNumber">
        Mobile Number
      </label>

      <input
        type="tel"
        id="phoneNumber"
        placeholder="Enter 10-digit mobile number"
        maxlength="10"
      >

      <!-- reCAPTCHA -->
      <div id="recaptcha-container"></div>

      <button id="sendOtpBtn">
        Send OTP
      </button>

    </div>


    <!-- OTP -->
    <div id="otpSection">

      <label for="otpCode">
        Enter OTP
      </label>

      <input
        type="number"
        id="otpCode"
        placeholder="Enter 6-digit OTP"
        maxlength="6"
      >

      <button id="verifyOtpBtn">
        Verify OTP & Login
      </button>

    </div>


    <p id="message"></p>

    <a href="index.html" class="back-home">
      ← Back to Home
    </a>

    <p class="terms">
      By continuing, you agree to our Terms & Conditions.
    </p>

  </div>


  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


  <script>

    // =========================================
    // FIREBASE CONFIG
    // =========================================

    
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDnixgjNIIVQt_CiOV7NARwaYJSD1uPAqk",
  authDomain: "rephone-b694e.firebaseapp.com",
  projectId: "rephone-b694e",
  storageBucket: "rephone-b694e.firebasestorage.app",
  messagingSenderId: "39576066626",
  appId: "1:39576066626:web:00a42e1d6324db16016bdb",
  measurementId: "G-7Y7Z06ZW2Z"
};

    


    // Start Firebase
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();


    // =========================================
    // reCAPTCHA
    // =========================================

    window.recaptchaVerifier =
      new firebase.auth.RecaptchaVerifier(
        "recaptcha-container",
        {
          size: "normal"
        }
      );


    let confirmationResult;


    // =========================================
    // SEND OTP
    // =========================================

    document
      .getElementById("sendOtpBtn")
      .addEventListener("click", async function () {

        const number =
          document
          .getElementById("phoneNumber")
          .value
          .trim();

        const message =
          document.getElementById("message");


        if (number.length !== 10) {

          message.innerText =
            "Please enter a valid 10-digit mobile number.";

          return;
        }


        const phoneNumber = "+91" + number;


        try {

          message.innerText =
            "Sending OTP...";


          confirmationResult =
            await auth.signInWithPhoneNumber(
              phoneNumber,
              window.recaptchaVerifier
            );


          document
            .getElementById("otpSection")
            .style.display = "block";


          document
            .getElementById("phoneSection")
            .style.display = "none";


          message.innerText =
            "OTP has been sent to your mobile number.";

        }

        catch (error) {

          console.error(error);

          message.innerText =
            "Unable to send OTP. Please try again.";

        }

      });


    // =========================================
    // VERIFY OTP
    // =========================================

    document
      .getElementById("verifyOtpBtn")
      .addEventListener("click", async function () {

        const otp =
          document
          .getElementById("otpCode")
          .value
          .trim();

        const message =
          document.getElementById("message");


        if (otp.length !== 6) {

          message.innerText =
            "Please enter the 6-digit OTP.";

          return;
        }


        try {

          await confirmationResult.confirm(otp);


          message.innerText =
            "Login successful!";


          setTimeout(function () {

            window.location.href =
              "my-orders.html";

          }, 1000);

        }

        catch (error) {

          console.error(error);

          message.innerText =
            "Invalid OTP. Please try again.";

        }

      });

  </script>

</body>
</html>
