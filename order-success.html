<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Order Successful</title><style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.container{
    max-width:450px;
    margin:30px auto;
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 12px rgba(0,0,0,.12);
}

.success{
    text-align:center;
}

.icon{
    width:70px;
    height:70px;
    margin:auto;
    background:#16a34a;
    color:white;
    border-radius:50%;
    font-size:45px;
    line-height:70px;
}

h1{
    color:#16a34a;
    margin-bottom:8px;
}

.subtitle{
    color:#555;
}

.orderBox{
    background:#f1f5f9;
    padding:15px;
    border-radius:8px;
    margin-top:20px;
    text-align:center;
}

.orderBox span{
    display:block;
    font-size:14px;
    color:#555;
}

.orderBox strong{
    display:block;
    margin-top:7px;
    font-size:21px;
}

.details{
    margin-top:20px;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:11px 0;
    border-bottom:1px solid #eee;
}

.row b{
    color:#333;
}

.row span{
    text-align:right;
}

.status{
    color:#16a34a;
    font-weight:bold;
}

.buttons{
    margin-top:25px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    font-size:17px;
    margin-top:10px;
    cursor:pointer;
}

.orders{
    background:#e5e7eb;
    color:#111;
}

.home{
    background:#16a34a;
    color:white;
}

</style></head><body><div class="container"><div class="success"><div class="icon">
    ✓
</div>

<h1>
    Order Successful!
</h1>

<p class="subtitle">
    Your order has been placed successfully.
</p>

</div><div class="orderBox"><span>
    Your Order ID
</span>

<strong id="orderId">
    Loading...
</strong>

</div><div class="details"><div class="row"><b>Product</b>

<span id="productName">
    Loading...
</span>

</div><div class="row"><b>Price</b>

<span id="price">
    Loading...
</span>

</div><div class="row"><b>Payment</b>

<span>
    Cash on Delivery
</span>

</div><div class="row"><b>Status</b>

<span class="status">
    Order Placed
</span>

</div><div class="row"><b>Customer</b>

<span id="customerName">
    Loading...
</span>

</div><div class="row"><b>Mobile</b>

<span id="mobile">
    Loading...
</span>

</div></div><div class="buttons"><button
class="orders"
onclick="goOrders()">

My Orders

</button><button
class="home"
onclick="goHome()">

Continue Shopping

</button></div></div><script>


// =====================================
// GET SAVED ORDER
// =====================================

const order =
    JSON.parse(
        localStorage.getItem("currentOrder")
    );


// =====================================
// SHOW ORDER
// =====================================

if(order){

    document.getElementById("orderId")
        .textContent =
        order.orderId || "N/A";


    document.getElementById("productName")
        .textContent =
        order.productName || "Product";


    document.getElementById("price")
        .textContent =
        order.price || "N/A";


    document.getElementById("customerName")
        .textContent =
        order.fullName || "N/A";


    document.getElementById("mobile")
        .textContent =
        order.mobile || "N/A";

}else{

    document.getElementById("orderId")
        .textContent =
        "Order not found";

}


// =====================================
// MY ORDERS
// =====================================

function goOrders(){

    window.location.href =
        "orders.html";

}


// =====================================
// HOME
// =====================================

function goHome(){

    window.location.href =
        "index.html";

}

</script></body></html>
