<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Return Request Successful</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            padding: 20px;

            background: #f3f3f3;

            font-family: Arial, sans-serif;

        }


        .success-box {

            width: 100%;

            max-width: 500px;

            margin: 80px auto;

            background: white;

            padding: 40px 25px;

            border-radius: 15px;

            text-align: center;

            box-shadow:
                0 3px 15px
                rgba(0,0,0,0.15);

        }


        .check {

            width: 75px;

            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #22c55e;

            color: white;

            font-size: 48px;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        h1 {

            font-size: 27px;

            margin: 10px 0 15px;

            line-height: 1.3;

        }


        .message {

            color: #666;

            font-size: 16px;

            line-height: 1.6;

        }


        .return-info {

            margin-top: 25px;

            padding: 15px;

            background: #f8f8f8;

            border-radius: 8px;

            text-align: left;

        }


        .return-info p {

            margin: 10px 0;

            font-size: 15px;

        }


        .return-info strong {

            color: #222;

        }


        .status {

            margin-top: 20px;

            padding: 13px;

            border-radius: 8px;

            background: #f1fdf5;

            color: #15803d;

            font-weight: bold;

        }


        button {

            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: none;

            border-radius: 8px;

            background: #ff9900;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }

    </style>

</head>


<body>


<div class="success-box">


    <!-- CHECK ICON -->

    <div class="check">

        ✓

    </div>


    <!-- SUCCESS MESSAGE -->

    <h1>

        Return Request Submitted Successfully!

    </h1>


    <div class="message">

        Your return request has been
        successfully submitted.

        <br><br>

        Our team will review your request
        and contact you regarding the
        return process.

    </div>


    <!-- RETURN INFORMATION -->

    <div class="return-info">


        <p>

            <strong>Return ID:</strong>

            <span id="returnId">
                -
            </span>

        </p>


        <p>

            <strong>Mobile Number:</strong>

            <span id="mobileNumber">
                -
            </span>

        </p>


        <p>

            <strong>Order ID:</strong>

            <span id="orderId">
                -
            </span>

        </p>


        <p>

            <strong>Price:</strong>

            <span id="price">
                -
            </span>

        </p>


    </div>


    <!-- STATUS -->

    <div class="status">

        Return Status:
        Return Requested

    </div>


    <!-- MY ORDERS -->

    <button
        onclick="window.location.href='orders.html'">

        Go to My Orders

    </button>


</div>


<script>


// GET LAST RETURN REQUEST

let returnData =
    JSON.parse(
        localStorage.getItem("lastReturn")
    );


if (returnData) {


    document.getElementById("returnId")
        .innerText =
        returnData.returnId;


    document.getElementById("mobileNumber")
        .innerText =
        returnData.mobileNumber;


    document.getElementById("orderId")
        .innerText =
        returnData.orderId;


    document.getElementById("price")
        .innerText =
        returnData.price;

}


</script>


</body>

</html>
